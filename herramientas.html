<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herramientas Externas</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600&display=swap" rel="stylesheet">
    <style>
        .tools-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 2rem;
        }
        .tool-box {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
            border-top: 5px solid #e67e22;
            transition: transform 0.3s ease;
        }
        .tool-box:hover {
            transform: translateY(-5px);
        }
        .tool-box h3 { margin-bottom: 0.5rem; color: #2c3e50; }
        .tool-box p { font-size: 0.85rem; color: #666; margin-bottom: 1.5rem; line-height: 1.4; word-break: break-all; }
        
        .tool-actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }
        .action-icon {
            cursor: pointer;
            font-size: 1.2rem;
            transition: opacity 0.2s;
            text-decoration: none;
        }
        .action-icon:hover { opacity: 0.7; }
        
        .btn-tool {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            background: #e67e22;
            color: white;
            text-decoration: none;
            display: inline-block;
        }
        .btn-tool:hover {
            opacity: 0.9;
        }

        /* Estilos para el modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: white;
            padding: 2rem;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo-container">
            <a href="index.html" style="text-decoration: none; display: flex; align-items: center;">
                <img src="img/solo_psia_peque.PNG" alt="Logo" class="logo-img">
            </a>
        </div>
        <div class="user-info-container">
            <button class="btn-logout" id="logout-btn">Cerrar sesión</button>
            <span id="user-name"></span>
        </div>
    </header>

    <main class="container">
        <div class="agenda-header" style="text-align: left;">
            <h2>Herramientas y Aplicaciones Externas</h2>
            <div class="agenda-actions">
                <button class="btn-turquesa" style="border:none; cursor:pointer; background-color: #e67e22;" onclick="openToolModal()">Nueva Herramienta</button>
                <a href="index.html" class="home-icon" title="Inicio">🏠</a>
                <a href="index.html" class="back-link">&larr; Volver</a>
            </div>
        </div>

        <div class="tools-container" id="tools-list">
            <!-- Cargando... -->
        </div>
    </main>

    <!-- Modal para Nueva/Editar Herramienta -->
    <div id="modalTool" class="modal">
        <div class="modal-content">
            <div class="agenda-header">
                <h2 id="modal-title">Añadir Herramienta</h2>
                <span class="close-modal" onclick="closeToolModal()" style="cursor:pointer; font-size:1.5rem;">&times;</span>
            </div>
            <form id="form-tool" class="form-grid" style="display: flex; flex-direction: column; gap: 15px; text-align: left;">
                <div class="form-group">
                    <label for="tool-name">Nombre de la Aplicación</label>
                    <input type="text" id="tool-name" required placeholder="Ej: ChatGPT, Manual DSM-5, etc.">
                </div>
                <div class="form-group">
                    <label for="tool-url">Ruta de acceso / URL</label>
                    <input type="text" id="tool-url" required placeholder="https://...">
                </div>
                <div class="form-group">
                    <label for="tool-desc">Descripción (opcional)</label>
                    <input type="text" id="tool-desc" placeholder="Breve descripción de la herramienta">
                </div>
                <div class="form-actions" style="margin-top: 10px; display: flex; gap: 10px; justify-content: flex-end;">
                    <button type="submit" class="btn-turquesa" style="background-color: #e67e22;">Guardar</button>
                    <button type="button" class="back-link" style="border:none; background:none; cursor:pointer;" onclick="closeToolModal()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 PsicoFact - Gestión de Psicología</p>
    </footer>

    <script src="js/config.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, addDoc, onSnapshot, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = window.APP_CONFIG.firebase;
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let editingId = null;

        // UI Elements
        const toolsList = document.getElementById('tools-list');
        const modalTool = document.getElementById('modalTool');
        const formTool = document.getElementById('form-tool');
        const toolName = document.getElementById('tool-name');
        const toolUrl = document.getElementById('tool-url');
        const toolDesc = document.getElementById('tool-desc');
        const modalTitle = document.getElementById('modal-title');

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = user;

            // Cargar nombre del facultativo
            try {
                const snap = await getDoc(doc(db, 'usuarios', user.uid, 'facultativo', 'perfil'));
                const nameEl = document.getElementById('user-name');
                if (nameEl) {
                    if (snap.exists()) {
                        const d = snap.data();
                        const fullName = [d.nombre, d.apellidos].filter(Boolean).join(' ');
                        nameEl.textContent = fullName || user.email;
                    } else {
                        nameEl.textContent = user.email;
                    }
                }
            } catch(e) { 
                console.error("Error cargando perfil:", e);
            }

            loadTools(user.uid);
        });

        function loadTools(uid) {
            const q = query(collection(db, "usuarios", uid, "herramientas"), orderBy("nombre"));
            onSnapshot(q, (snapshot) => {
                toolsList.innerHTML = '';
                if (snapshot.empty) {
                    toolsList.innerHTML = `
                        <div class="tool-box" style="grid-column: 1/-1;">
                            <div class="icon" style="font-size: 3rem; margin-bottom: 1rem;">⚙️</div>
                            <h3>Sin herramientas aún</h3>
                            <p>Haz clic en "Nueva Herramienta" para empezar a organizar tus accesos directos.</p>
                        </div>
                    `;
                    return;
                }
                snapshot.forEach((doc) => {
                    const tool = doc.data();
                    const id = doc.id;
                    const toolCard = document.createElement('div');
                    toolCard.className = 'tool-box';
                    
                    let finalUrl = tool.url;
                    // Detectar rutas locales de Windows (ej: C:\...) o rutas de red (\\...)
                    if (finalUrl.match(/^[a-zA-Z]:\\/) || finalUrl.startsWith('\\\\')) {
                        finalUrl = 'file:///' + finalUrl.replace(/\\/g, '/');
                    } else if (!finalUrl.startsWith('http') && !finalUrl.includes('://') && !finalUrl.startsWith('file:')) {
                        finalUrl = 'https://' + finalUrl;
                    }
                    
                    toolCard.innerHTML = `
                        <div class="icon" style="font-size: 2.5rem; margin-bottom: 0.5rem;">🔗</div>
                        <h3>${tool.nombre}</h3>
                        <p>${tool.descripcion || 'Sin descripción'}</p>
                        <a href="${finalUrl}" target="_blank" class="btn-tool">Abrir</a>
                        <div class="tool-actions">
                            <span class="action-icon" title="Editar" onclick="window.editTool('${id}', '${tool.nombre.replace(/'/g, "\\'")}', '${tool.url.replace(/'/g, "\\'")}', '${(tool.descripcion || '').replace(/'/g, "\\'")}')">✏️</span>
                            <span class="action-icon" title="Eliminar" onclick="window.deleteTool('${id}')">🗑️</span>
                        </div>
                    `;
                    toolsList.appendChild(toolCard);
                });
            });
        }

        // Global functions for buttons
        window.openToolModal = () => {
            editingId = null;
            modalTitle.innerText = "Añadir Herramienta";
            formTool.reset();
            modalTool.style.display = 'flex';
        };

        window.closeToolModal = () => {
            modalTool.style.display = 'none';
        };

        window.editTool = (id, name, url, desc) => {
            editingId = id;
            modalTitle.innerText = "Editar Herramienta";
            toolName.value = name;
            toolUrl.value = url;
            toolDesc.value = desc;
            modalTool.style.display = 'flex';
        };

        window.deleteTool = async (id) => {
            if (confirm('¿Estás seguro de que quieres eliminar esta herramienta?')) {
                try {
                    await deleteDoc(doc(db, "usuarios", currentUser.uid, "herramientas", id));
                } catch (error) {
                    console.error("Error eliminando herramienta:", error);
                    alert("Error al eliminar");
                }
            }
        };

        formTool.addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                nombre: toolName.value,
                url: toolUrl.value,
                descripcion: toolDesc.value,
                actualizado: new Date()
            };

            try {
                if (editingId) {
                    await updateDoc(doc(db, "usuarios", currentUser.uid, "herramientas", editingId), data);
                } else {
                    await addDoc(collection(db, "usuarios", currentUser.uid, "herramientas"), data);
                }
                closeToolModal();
            } catch (error) {
                console.error("Error guardando herramienta:", error);
                alert("Error al guardar");
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));
    </script>
</body>
</html>
