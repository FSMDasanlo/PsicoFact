<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Línea de Vida</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600&display=swap" rel="stylesheet">
    <style>
        .lifeline-form {
            display: grid;
            grid-template-columns: 110px 110px 160px 1fr auto auto;
            gap: 15px;
            align-items: flex-end;
        }
        .lifeline-label {
            text-align: center;
            font-weight: 700;
            font-size: 1.05rem;
            margin: 0 0 0.3rem;
        }
        .lifeline-label.top { color: #27ae60; }
        .lifeline-label.bottom { color: #c0392b; margin: 0.3rem 0 0; }

        .timeline-outer {
            overflow-x: auto;
            padding: 10px 0 25px;
        }
        .timeline-inner {
            position: relative;
            display: inline-flex;
            align-items: stretch;
            min-height: 420px;
            min-width: 100%;
            box-sizing: border-box;
            padding: 0 40px;
        }
        .timeline-baseline {
            position: absolute;
            left: 20px;
            right: 20px;
            top: 50%;
            height: 4px;
            transform: translateY(-50%);
            background: linear-gradient(to right, var(--azul-oscuro), var(--azul-primario));
            border-radius: 2px;
            z-index: 1;
        }
        .timeline-item {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 190px;
            flex-shrink: 0;
        }
        .timeline-item .tl-top,
        .timeline-item .tl-bottom {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .timeline-item .tl-top {
            justify-content: flex-end;
        }
        .timeline-item .tl-bottom {
            justify-content: flex-start;
        }
        .tl-box {
            background: var(--blanco);
            border-radius: 10px;
            padding: 10px 12px;
            max-width: 175px;
            text-align: center;
            font-size: 0.82rem;
            color: #333;
            box-shadow: 0 3px 8px rgba(0,0,0,0.12);
        }
        .timeline-item.agradable .tl-box { border: 2px solid #27ae60; }
        .timeline-item.desagradable .tl-box { border: 2px solid #c0392b; }
        .tl-box .tl-acciones {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 6px;
        }
        .tl-box .tl-acciones a {
            cursor: pointer;
            text-decoration: none;
            font-size: 0.85rem;
        }
        .tl-connector {
            width: 2px;
            height: 28px;
            background: #b0b0b0;
        }
        .tl-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--blanco);
            border: 3px solid var(--azul-oscuro);
            flex-shrink: 0;
            cursor: grab;
        }
        .tl-dot:active { cursor: grabbing; }
        .timeline-item.agradable .tl-dot { border-color: #27ae60; }
        .timeline-item.desagradable .tl-dot { border-color: #c0392b; }
        .timeline-item.drag-over .tl-dot {
            transform: scale(1.4);
            box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.35);
        }
        .tl-age-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--azul-oscuro);
            white-space: nowrap;
            margin: 4px 0;
        }
        .lifeline-empty {
            color: #95a5a6;
            text-align: center;
            padding: 40px 0;
        }
        .drag-age-indicator {
            position: fixed;
            display: none;
            pointer-events: none;
            background: var(--azul-oscuro);
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            z-index: 3000;
            transform: translate(-50%, -140%);
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo-container">
            <a href="index.html" style="text-decoration: none; display: flex; align-items: center;">
                <img src="img/solo_psia_peque.PNG" alt="Logo" class="logo-img">
            </a>
        </div>
        <div class="user-info-container">
            <button class="btn-logout" id="logout-btn">Cerrar sesión</button>
            <span id="user-name"></span>
        </div>
    </header>

    <main class="container">
        <div class="agenda-header" style="text-align: left;">
            <h2 id="lifeline-titulo">Línea de Vida de: Cargando...</h2>
            <div class="agenda-actions">
                <a href="index.html" class="home-icon" title="Inicio">🏠</a>
                <a href="Con_pacientes.html" class="back-link">&larr; Volver</a>
            </div>
        </div>

        <!-- Formulario para añadir/editar acontecimiento -->
        <section class="agenda-container" style="margin-bottom: 2rem;">
            <h3 style="color: var(--azul-oscuro); margin-bottom: 1rem;">Añadir Acontecimiento</h3>
            <form id="form-evento" class="lifeline-form">
                <input type="hidden" id="evento-id">
                <div class="form-group">
                    <label for="evento-anios">Años</label>
                    <input type="number" id="evento-anios" min="0" step="1" placeholder="0" required style="width: 100%;">
                </div>
                <div class="form-group">
                    <label for="evento-meses">Meses</label>
                    <input type="number" id="evento-meses" min="0" max="11" step="1" placeholder="0" style="width: 100%;">
                </div>
                <div class="form-group">
                    <label for="evento-tipo">Tipo</label>
                    <select id="evento-tipo" style="width: 100%;">
                        <option value="agradable">😊 Agradable</option>
                        <option value="desagradable">😞 Desagradable</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="evento-descripcion">Acontecimiento</label>
                    <input type="text" id="evento-descripcion" placeholder="Describe el acontecimiento..." required style="width: 100%;">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <button type="submit" id="btn-guardar-evento" class="btn-turquesa" style="cursor: pointer;">Añadir</button>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <button type="button" id="btn-cancelar-evento" class="back-link" style="border:none; background:none; cursor:pointer; display:none;" onclick="cancelEdit()">Cancelar</button>
                </div>
            </form>
        </section>

        <!-- Línea de vida: acontecimientos conectados a una línea temporal -->
        <section class="agenda-container">
            <div class="lifeline-label top">😊 Agradables</div>
            <div class="timeline-outer">
                <div id="timeline-track" class="timeline-inner">
                    <p class="lifeline-empty">Aún no hay acontecimientos registrados</p>
                </div>
            </div>
            <div class="lifeline-label bottom">😞 Desagradables</div>
        </section>
    </main>

    <div id="drag-age-indicator" class="drag-age-indicator"></div>

    <footer>
        <p>&copy; 2026 PsicoFact - Gestión de Psicología</p>
    </footer>

    <script src="js/config.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, addDoc, updateDoc, deleteDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = window.APP_CONFIG.firebase;

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        let currentUid = null;
        let patientId = null;
        let currentPatientName = '';
        let eventos = [];

        const uCol = (name) => collection(db, "usuarios", currentUid, name);
        const uDoc = (name, id) => doc(db, "usuarios", currentUid, name, id);

        function showToast(message, type = 'success') {
            let container = document.getElementById('toast-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toast-container';
                document.body.appendChild(container);
            }
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => container.removeChild(toast), 300);
            }, 3500);
        }

        function formatEdad(anios, meses) {
            anios = parseInt(anios) || 0;
            meses = parseInt(meses) || 0;
            const partAnios = anios > 0 ? `${anios} ${anios === 1 ? 'año' : 'años'}` : '';
            const partMeses = meses > 0 ? `${meses} ${meses === 1 ? 'mes' : 'meses'}` : '';
            if (partAnios && partMeses) return `${partAnios} y ${partMeses}`;
            if (partAnios) return partAnios;
            if (partMeses) return partMeses;
            return '0 meses';
        }

        async function loadPatientAndEvents() {
            const params = new URLSearchParams(window.location.search);
            patientId = params.get('id');
            if (!patientId) {
                alert("No se ha especificado un ID de paciente.");
                window.location.href = 'Con_pacientes.html';
                return;
            }

            try {
                const pSnap = await getDoc(uDoc('pacientes', patientId));
                if (!pSnap.exists()) {
                    alert("Paciente no encontrado.");
                    window.location.href = 'Con_pacientes.html';
                    return;
                }
                const p = pSnap.data();
                currentPatientName = `${p.nombre} ${p.apellidos}`;
                document.getElementById('lifeline-titulo').textContent = `Línea de Vida de: ${currentPatientName}`;

                await loadEventos();
            } catch (error) {
                console.error("Error cargando línea de vida:", error);
                showToast("Error al cargar los datos.", "error");
            }
        }

        async function loadEventos() {
            const q = query(uCol('lineavida'), where('pacienteId', '==', patientId));
            const snap = await getDocs(q);
            eventos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            eventos.sort((a, b) => (a.edad_anios * 12 + a.edad_meses) - (b.edad_anios * 12 + b.edad_meses));
            renderEventos();
        }

        function renderEventos() {
            const track = document.getElementById('timeline-track');

            if (eventos.length === 0) {
                track.innerHTML = '<p class="lifeline-empty">Aún no hay acontecimientos registrados</p>';
                return;
            }

            track.innerHTML = `<div class="timeline-baseline"></div>` + eventos.map(renderEventoItem).join('');
        }

        function renderEventoItem(e) {
            const boxHtml = `
                <div class="tl-box">
                    <div class="desc">${e.descripcion}</div>
                    <div class="tl-acciones">
                        <a onclick="editEvento('${e.id}')" title="Editar">✏️</a>
                        <a onclick="deleteEvento('${e.id}')" title="Eliminar">🗑️</a>
                    </div>
                </div>`;

            const topContent = e.tipo === 'agradable' ? `${boxHtml}<div class="tl-connector"></div>` : '';
            const bottomContent = e.tipo === 'desagradable' ? `<div class="tl-connector"></div>${boxHtml}` : '';

            return `
                <div class="timeline-item ${e.tipo}" data-id="${e.id}"
                     ondragover="onTimelineDragOver(event)" ondragleave="onTimelineDragLeave(event)" ondrop="onTimelineDrop(event, '${e.id}')">
                    <div class="tl-top">${topContent}</div>
                    <div class="tl-dot" draggable="true" ondragstart="onDotDragStart(event, '${e.id}')" ondragend="onDotDragEnd(event)" title="${formatEdad(e.edad_anios, e.edad_meses)} (arrastra para mover)"></div>
                    <div class="tl-age-label">${formatEdad(e.edad_anios, e.edad_meses)}</div>
                    <div class="tl-bottom">${bottomContent}</div>
                </div>`;
        }

        let draggedEventId = null;
        const dragIndicator = document.getElementById('drag-age-indicator');

        const toMonths = (ev) => (parseInt(ev.edad_anios) || 0) * 12 + (parseInt(ev.edad_meses) || 0);

        // Calcula la edad prospectiva (años/meses) que tendría el acontecimiento arrastrado
        // si se soltase junto a targetId (antes o después según isAfter). Devuelve null si no hay cambio posible.
        function calcProspectiveAge(draggedId, targetId, isAfter) {
            const orderedIds = eventos.map(ev => ev.id).filter(id => id !== draggedId);
            let insertAt = orderedIds.indexOf(targetId);
            if (insertAt === -1) return null;
            if (isAfter) insertAt += 1;
            orderedIds.splice(insertAt, 0, draggedId);

            const newIndex = orderedIds.indexOf(draggedId);
            const prevEv = newIndex > 0 ? eventos.find(ev => ev.id === orderedIds[newIndex - 1]) : null;
            const nextEv = newIndex < orderedIds.length - 1 ? eventos.find(ev => ev.id === orderedIds[newIndex + 1]) : null;

            let newTotalMonths;
            if (prevEv && nextEv) {
                newTotalMonths = (toMonths(prevEv) + toMonths(nextEv)) / 2;
            } else if (prevEv && !nextEv) {
                newTotalMonths = toMonths(prevEv) + 1;
            } else if (!prevEv && nextEv) {
                newTotalMonths = Math.max(0, toMonths(nextEv) - 1);
            } else {
                return null; // Único evento, nada que reordenar
            }

            newTotalMonths = Math.max(0, Math.round(newTotalMonths));
            return { anios: Math.floor(newTotalMonths / 12), meses: newTotalMonths % 12 };
        }

        function moveDragIndicator(e, edad) {
            if (!dragIndicator || !edad) return;
            dragIndicator.textContent = formatEdad(edad.anios, edad.meses);
            dragIndicator.style.left = `${e.clientX}px`;
            dragIndicator.style.top = `${e.clientY}px`;
            dragIndicator.style.display = 'block';
        }

        window.onDotDragStart = function(e, id) {
            draggedEventId = id;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', id);
            const ev = eventos.find(ev => ev.id === id);
            if (dragIndicator && ev) {
                dragIndicator.textContent = formatEdad(ev.edad_anios, ev.edad_meses);
                dragIndicator.style.left = `${e.clientX}px`;
                dragIndicator.style.top = `${e.clientY}px`;
                dragIndicator.style.display = 'block';
            }
        };

        window.onDotDragEnd = function() {
            draggedEventId = null;
            document.querySelectorAll('.timeline-item.drag-over').forEach(el => el.classList.remove('drag-over'));
            if (dragIndicator) dragIndicator.style.display = 'none';
        };

        window.onTimelineDragOver = function(e) {
            if (!draggedEventId) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            e.currentTarget.classList.add('drag-over');

            const targetId = e.currentTarget.dataset.id;
            if (targetId && targetId !== draggedEventId) {
                const rect = e.currentTarget.getBoundingClientRect();
                const isAfter = (e.clientX - rect.left) > (rect.width / 2);
                const edad = calcProspectiveAge(draggedEventId, targetId, isAfter);
                moveDragIndicator(e, edad);
            }
        };

        window.onTimelineDragLeave = function(e) {
            e.currentTarget.classList.remove('drag-over');
        };

        window.onTimelineDrop = async function(e, targetId) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            if (dragIndicator) dragIndicator.style.display = 'none';
            if (!draggedEventId || draggedEventId === targetId) return;

            const draggedEv = eventos.find(ev => ev.id === draggedEventId);
            if (!draggedEv) return;

            // Decidir si se suelta antes o después del elemento objetivo según la posición X del cursor
            const rect = e.currentTarget.getBoundingClientRect();
            const isAfter = (e.clientX - rect.left) > (rect.width / 2);

            const edad = calcProspectiveAge(draggedEventId, targetId, isAfter);
            if (!edad) return; // Único evento, nada que reordenar

            try {
                await updateDoc(uDoc('lineavida', draggedEventId), { edad_anios: edad.anios, edad_meses: edad.meses });
                showToast('Acontecimiento movido en la línea de vida.', 'success');
                await loadEventos();
            } catch (error) {
                console.error('Error al mover el acontecimiento:', error);
                showToast('Error al mover el acontecimiento.', 'error');
            }
        };

        window.editEvento = function(id) {
            const e = eventos.find(ev => ev.id === id);
            if (!e) return;
            document.getElementById('evento-id').value = e.id;
            document.getElementById('evento-anios').value = e.edad_anios;
            document.getElementById('evento-meses').value = e.edad_meses;
            document.getElementById('evento-tipo').value = e.tipo;
            document.getElementById('evento-descripcion').value = e.descripcion;
            document.getElementById('btn-guardar-evento').textContent = 'Guardar Cambios';
            document.getElementById('btn-cancelar-evento').style.display = 'inline-block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.cancelEdit = function() {
            document.getElementById('form-evento').reset();
            document.getElementById('evento-id').value = '';
            document.getElementById('btn-guardar-evento').textContent = 'Añadir';
            document.getElementById('btn-cancelar-evento').style.display = 'none';
        };

        window.deleteEvento = async function(id) {
            if (!confirm('¿Está seguro de que desea eliminar este acontecimiento?')) return;
            await deleteDoc(uDoc('lineavida', id));
            showToast('Acontecimiento eliminado.', 'success');
            await loadEventos();
        };

        document.getElementById('form-evento').addEventListener('submit', async function(e) {
            e.preventDefault();
            const id = document.getElementById('evento-id').value;
            const anios = parseInt(document.getElementById('evento-anios').value);
            const meses = parseInt(document.getElementById('evento-meses').value) || 0;
            const data = {
                pacienteId: patientId,
                edad_anios: isNaN(anios) ? 0 : anios,
                edad_meses: meses,
                tipo: document.getElementById('evento-tipo').value,
                descripcion: document.getElementById('evento-descripcion').value.trim()
            };

            if (isNaN(anios) || !data.descripcion) {
                showToast('Rellene la edad (años) y el acontecimiento.', 'error');
                return;
            }

            try {
                if (id) {
                    await updateDoc(uDoc('lineavida', id), data);
                    showToast('Acontecimiento actualizado.', 'success');
                } else {
                    await addDoc(uCol('lineavida'), data);
                    showToast('Acontecimiento añadido.', 'success');
                }
                window.cancelEdit();
                await loadEventos();
            } catch (error) {
                console.error("Error guardando acontecimiento:", error);
                showToast('Error al guardar el acontecimiento.', 'error');
            }
        });

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'index.html'; return; }
            currentUid = user.uid;

            try {
                const snap = await getDoc(doc(db, 'usuarios', user.uid, 'facultativo', 'perfil'));
                const nameEl = document.getElementById('user-name');
                if (nameEl) {
                    if (snap.exists()) {
                        const d = snap.data();
                        const fullName = [d.nombre, d.apellidos].filter(Boolean).join(' ');
                        nameEl.textContent = fullName || user.email;
                    } else {
                        nameEl.textContent = user.email;
                    }
                }
            } catch (e) {
                console.error("Error cargando perfil:", e);
                const nameEl = document.getElementById('user-name');
                if (nameEl) nameEl.textContent = user.email;
            }

            loadPatientAndEvents();
        });

        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));
    </script>
</body>
</html>
